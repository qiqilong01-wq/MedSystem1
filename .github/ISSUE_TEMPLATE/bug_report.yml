name: Bug report
description: Report a reproducible MedSystem1 defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include patient identifiers, PHI, credentials, or secrets."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MedSystem1 version / commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Could this weaken a safety boundary?
      options: ["No", "Possibly", "Yes"]
    validations:
      required: true
