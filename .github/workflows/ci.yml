name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: ruff check .
      - run: pytest -q
      - run: python tools/validate_package.py
      - name: Validate installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/validate_installed_wheel.py"
      - run: python benchmarks/run_routing.py
      - run: python benchmarks/run_extraction.py --self-test

