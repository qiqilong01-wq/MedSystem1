[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "medsystem1"
version = "0.1.1.dev4"
description = "Local-first safety and routing layer for medical AI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MedSystem1 contributors" }]
keywords = ["medical-ai", "agent", "safety", "routing", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
medsystem1 = "medsystem1.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "build==1.2.2.post1"]

[project.urls]
Repository = "https://github.com/qiqilong01-wq/MedSystem1"
Issues = "https://github.com/qiqilong01-wq/MedSystem1/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medsystem1"]

[tool.hatch.build.targets.wheel.force-include]
"configs/v0.1" = "medsystem1/_data/configs/v0.1"
"schemas/v0.1" = "medsystem1/_data/schemas/v0.1"
"schemas/deployment/v0.1" = "medsystem1/_data/schemas/deployment/v0.1"
"examples/ophthalmology/request.json" = "medsystem1/_data/examples/ophthalmology/request.json"
"examples/ophthalmology/local-candidate.request.synthetic.json" = "medsystem1/_data/examples/ophthalmology/local-candidate.request.synthetic.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

